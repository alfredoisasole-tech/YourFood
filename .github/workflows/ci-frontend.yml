name: CI Frontend

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'

jobs:
  ci-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/frontend

      - name: Typecheck
        run: npx tsc --noEmit --project apps/frontend/tsconfig.json

      - name: Tests
        run: npm run test --workspace=apps/frontend

      - name: Build
        run: npm run build --workspace=apps/frontend
