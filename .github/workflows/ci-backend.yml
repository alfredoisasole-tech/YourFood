name: CI Backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'

jobs:
  ci-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mealapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mealapp_test?schema=public
      # Active les tests d'intégration avec base (tests/db) : la base de CI leur est dédiée
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mealapp_test?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint --workspace=apps/backend --workspace=packages/shared

      - name: Typecheck
        run: npx tsc --noEmit --project apps/backend/tsconfig.json

      - name: Build de production
        run: npm run build --workspace=apps/backend

      - name: Run migrations
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

      - name: Tests
        run: npm run test --workspace=apps/backend

      - name: Build
        run: npm run build --workspace=apps/backend
